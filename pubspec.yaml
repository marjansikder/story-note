name: date_calculator
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.4+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  table_calendar: ^3.2.0
  permission_handler: ^12.0.1
  google_fonts: ^6.3.2
  fluttertoast: ^9.0.0
  flutter_font_icons: ^2.2.7
  font_awesome_flutter: ^10.12.0
  flutter_riverpod: ^2.6.1
  watcher: ^1.1.4
  toastification: ^3.0.3
  flutter_svg: ^2.2.2
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.2.1
  flutter_spinkit: ^5.2.2
  shadify: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.10.1


flutter:
  uses-material-design: true
  fonts:
    - family: Hind Siliguri
      fonts:
        - asset: assets/font/HindSiliguri-Regular.ttf
        - asset: assets/font/HindSiliguri-Medium.ttf
          style: normal
          weight: 700

    - family: Jost
      fonts:
        - asset: assets/font/Jost-Regular.ttf
          style: normal

    - family: Kohinoor
      fonts:
        - asset: assets/font/kohinoor_Urbanist.ttf
          style: normal

    - family: MiSans
      fonts:
        - asset: assets/font/MiSans_বাংলা.ttf
          style: normal

    - family: Watford
      fonts:
        - asset: assets/font/watfard-regular.ttf
          style: normal

    - family: okkhor
      fonts:
        - asset: assets/font/badhon_anmona.ttf
          style: normal
  assets:
    - assets/icons/
    - assets/font/
    - assets/image_svg/

